<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キッチン在庫管理</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🍳 キッチン在庫管理</h1>
            <div class="header-actions">
                <button id="addItemBtn" class="btn btn-primary">+ 食材追加</button>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="食材を検索...">
                </div>
            </div>
        </header>

        <div class="alerts" id="alerts">
            <!-- 警告メッセージがここに表示される -->
        </div>

        <div class="controls">
            <div class="filter-controls">
                <select id="categoryFilter">
                    <option value="">すべてのカテゴリー</option>
                    <option value="野菜">野菜</option>
                    <option value="肉類">肉類</option>
                    <option value="魚類">魚類</option>
                    <option value="乳製品">乳製品</option>
                    <option value="調味料">調味料</option>
                    <option value="レトルト">レトルト</option>
                    <option value="カップ麺">カップ麺</option>
                    <option value="冷凍食品">冷凍食品</option>
                    <option value="その他">その他</option>
                </select>
                <select id="sortBy">
                    <option value="name">名前順</option>
                    <option value="category">カテゴリー順</option>
                    <option value="quantity">在庫数順</option>
                    <option value="expiry">消費期限順</option>
                </select>
            </div>
        </div>

        <main class="inventory-grid" id="inventoryGrid">
            <!-- 在庫アイテムがここに表示される -->
        </main>
    </div>

    <!-- モーダル: 食材追加/編集 -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">食材追加</h2>
                <span class="close">&times;</span>
            </div>
            <form id="itemForm">
                <div class="form-group">
                    <label for="itemName">食材名 *</label>
                    <input type="text" id="itemName" required>
                </div>
                <div class="form-group">
                    <label for="itemCategory">カテゴリー *</label>
                    <select id="itemCategory" required>
                        <option value="">選択してください</option>
                        <option value="野菜">野菜</option>
                        <option value="肉類">肉類</option>
                        <option value="魚類">魚類</option>
                        <option value="乳製品">乳製品</option>
                        <option value="調味料">調味料</option>
                        <option value="レトルト">レトルト</option>
                        <option value="カップ麺">カップ麺</option>
                        <option value="冷凍食品">冷凍食品</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="itemQuantity">数量 *</label>
                        <input type="number" id="itemQuantity" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="itemUnit">単位</label>
                        <select id="itemUnit">
                            <option value="個">個</option>
                            <option value="本">本</option>
                            <option value="袋">袋</option>
                            <option value="パック">パック</option>
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="L">L</option>
                            <option value="ml">ml</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="itemExpiry">消費期限</label>
                    <input type="date" id="itemExpiry">
                </div>
                <div class="form-group">
                    <label for="itemNote">メモ</label>
                    <textarea id="itemNote" rows="3"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">キャンセル</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>削除確認</h2>
            </div>
            <p>この食材を削除してもよろしいですか？</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancelDeleteBtn">キャンセル</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">削除</button>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="utils.js"></script>
    <script src="app.js"></script>
</body>
</html>
